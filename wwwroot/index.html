<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎄 Merry Christmas Tree</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/terminal.css?v=3" />
    <script type="importmap"></script>
    <style>
        body {
            background-color: #030509;
            color: #d8e2ec;
            margin: 0;
            font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="console-intro">
            <div class="console-window">
                <div class="console-titlebar">
                    <div class="console-dots">
                        <span class="console-dot red"></span>
                        <span class="console-dot yellow"></span>
                        <span class="console-dot green"></span>
                    </div>
                    <span>northpole-shell — bash</span>
                    <span></span>
                </div>
                <div class="console-body">
                    <div>
                        <div class="console-prompt-line">
                            <span class="console-user">santa@northpole</span><span>:</span><span class="console-path">~/tree</span><span>$</span>
                            <span class="console-cursor"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/treeTerminal.js?v=4"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
